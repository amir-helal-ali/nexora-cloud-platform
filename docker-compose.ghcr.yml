# ============================================================================
# Nexora Cloud Platform — GHCR Docker Compose
# ============================================================================
# Uses pre-built images from GitHub Container Registry (no local build needed).
#
# Usage:
#   1. Copy .env.example to .env and edit values
#   2. docker compose -f docker-compose.ghcr.yml up -d
# ============================================================================

services:
  nexora:
    image: ghcr.io/nexora-cloud/dashboard:latest
    container_name: nexora-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/nexora.db
      - REALTIME_PORT=3003
      - REALTIME_URL=http://realtime:3003
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
    volumes:
      - nexora-data:/app/data
    depends_on:
      realtime:
        condition: service_healthy
    networks:
      - nexora-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  realtime:
    image: ghcr.io/nexora-cloud/realtime:latest
    container_name: nexora-realtime
    restart: unless-stopped
    ports:
      - "${REALTIME_PORT:-3003}:3003"
    environment:
      - NODE_ENV=production
      - REALTIME_PORT=3003
    networks:
      - nexora-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3003/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nexora-data:
    driver: local
    name: nexora-data

networks:
  nexora-network:
    driver: bridge
    name: nexora-network
