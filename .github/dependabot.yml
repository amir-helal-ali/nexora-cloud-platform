# ============================================================================
# Nexora Cloud — Dependabot Configuration
# ============================================================================
# Keeps dependencies up-to-date automatically.
# ============================================================================

version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm dependencies (main app)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Cairo"
    open-pull-requests-limit: 10
    target-branch: "develop"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      nextjs:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      radix:
        patterns:
          - "@radix-ui/*"
      shadcn:
        patterns:
          - "class-variance-authority"
          - "clsx"
          - "tailwind-merge"
          - "tailwindcss-animate"
          - "cmdk"
          - "vaul"
          - "sonner"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/client"
      devops:
        patterns:
          - "eslint"
          - "eslint-config-next"
          - "typescript"
          - "bun-types"
          - "@types/*"

  # ---------------------------------------------------------------------------
  # npm dependencies (realtime service)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/mini-services/realtime-service"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    target-branch: "develop"
    labels:
      - "dependencies"
      - "npm"
      - "realtime"
    commit-message:
      prefix: "deps"
      include: "scope"

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # ---------------------------------------------------------------------------
  # Docker base images
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
      include: "scope"
