# ============================================================================
# Nexora Cloud Platform — CI Pipeline
# ============================================================================
# Runs on every push and pull request to ensure code quality.
# ============================================================================

name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

# Cancel previous runs on the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  BUN_VERSION: '1.3'

jobs:
  # ---------------------------------------------------------------------------
  # Lint + Type Check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 💾 Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔍 Generate Prisma client
        run: bunx prisma generate
        env:
          DATABASE_URL: "file:/tmp/ci.db"

      - name: ✅ Run ESLint
        run: bun run lint

      - name: ✅ TypeScript type check
        run: bunx tsc --noEmit || true  # Non-blocking for now

  # ---------------------------------------------------------------------------
  # Build verification
  # ---------------------------------------------------------------------------
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 💾 Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .next/cache
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-build-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-build-

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔍 Generate Prisma client
        run: bunx prisma generate
        env:
          DATABASE_URL: "file:/tmp/ci.db"

      - name: 🏗️ Build Next.js
        run: bun run build
        env:
          DATABASE_URL: "file:/tmp/ci.db"
          NEXT_TELEMETRY_DISABLED: '1'

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Build realtime service
  # ---------------------------------------------------------------------------
  build-realtime:
    name: Build Realtime Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 💾 Cache realtime deps
        uses: actions/cache@v4
        with:
          path: |
            mini-services/realtime-service/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-realtime-${{ hashFiles('mini-services/realtime-service/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-realtime-

      - name: 📥 Install realtime deps
        run: |
          cd mini-services/realtime-service
          bun install --frozen-lockfile

      - name: ✅ Verify realtime service starts
        run: |
          cd mini-services/realtime-service
          timeout 5 bun index.ts || true

  # ---------------------------------------------------------------------------
  # Security audit
  # ---------------------------------------------------------------------------
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔒 Run audit
        run: bun audit || true  # Non-blocking

      - name: 🔍 CodeQL analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
        continue-on-error: true

      - name: 🔍 Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Docker build verification
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🏗️ Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nexora-cloud/dashboard:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build realtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.realtime
          push: false
          tags: nexora-cloud/realtime:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Summary
  # ---------------------------------------------------------------------------
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, build, build-realtime, security, docker-build]
    if: always()
    steps:
      - name: 📊 Job status
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Verification | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Realtime | ${{ needs.build-realtime.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
